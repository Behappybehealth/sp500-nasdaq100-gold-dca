# 回归测试：push main 时跑 pytest。
#
# 全部用例离线（不抓行情、不连 Google Sheets），所以 CI 不需要任何 secrets，
# 也不会因为 Yahoo 限流而红——那种红是噪音，会让人开始忽略红灯。
name: tests

on:
  push:
    branches: [main]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 贴近 Streamlit Community Cloud：Linux + 较低 Python，验证范围文件仍装得上。
          - os: ubuntu-latest
            python-version: "3.12"
            requirements: requirements.txt
            install-pytest: true
          # 复刻开发机：Windows + Python 3.14，整套依赖走全钉 lock。
          - os: windows-latest
            python-version: "3.14"
            requirements: requirements-dev.lock
            install-pytest: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.requirements }}"
          if [ "${{ matrix.install-pytest }}" = "true" ]; then
            python -m pip install pytest==9.1.1
          fi

      - name: 跑测试
        run: python -m pytest
