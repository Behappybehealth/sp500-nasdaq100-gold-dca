# ---- 模拟定投决策台 · 多用户部署模板 ----
#
# 使用方法：
#   1. 复制本文件到项目根目录
#   2. 用 setup_user.sh 自动添加用户（或手动复制 user1 块改名）
#   3. docker compose up -d
#
# 架构：nginx(80) → user1(8501) / user2(8502) / user3(8503) ...
# 每个用户独立 data volume，数据完全隔离

services:
  # ---- 反向代理（唯一公网入口）----
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user1
    restart: unless-stopped

  # ---- 用户实例模板（复制此块 + 改名字即可新增用户）----
  user1:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: dca-user1
    command: ["--base-dir", "/app/user-data"]
    volumes:
      - ./data/user1:/app/user-data    # 用户独立数据目录
    expose:
      - "8501"                         # 只对内暴露，nginx 转发
    restart: unless-stopped
    mem_limit: 512m
    # 如需新增用户，复制下面注释块并修改：
    #
    # user2:
    #   build:
    #     context: .
    #     dockerfile: deploy/Dockerfile
